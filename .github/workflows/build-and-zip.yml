name: Build and Release Chrome Extension

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hs-nav-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read package version
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME must match package version v$PACKAGE_VERSION."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate, build, and test
        run: npm run check

      - name: Create versioned archive and checksum
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          archive="hs-nav-v${PACKAGE_VERSION}.zip"
          (cd dist && zip -r "../${archive}" .)
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hs-nav-v${{ steps.package.outputs.version }}
          path: |
            hs-nav-v${{ steps.package.outputs.version }}.zip
            hs-nav-v${{ steps.package.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: build-and-zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download tested release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: hs-nav-v${{ needs.build-and-zip.outputs.version }}
          path: release-assets

      - name: Verify archive checksum
        working-directory: release-assets
        env:
          PACKAGE_VERSION: ${{ needs.build-and-zip.outputs.version }}
        run: sha256sum --check "hs-nav-v${PACKAGE_VERSION}.zip.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build-and-zip.outputs.version }}
        run: |
          archive="hs-nav-v${PACKAGE_VERSION}.zip"
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/${archive}" \
            "release-assets/${archive}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "HS Nav v${PACKAGE_VERSION}"
